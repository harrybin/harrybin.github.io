<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title description">
  <title id="title">From a model brief to a verified 3D print</title>
  <desc id="description">A four stage workflow moves from text, photos, and video frames through measured Python or organic Blender modeling, visual inspection, and final OrcaSlicer verification.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1600" height="760" rx="36" fill="url(#background)"/>
  <circle cx="1420" cy="90" r="220" fill="#2563eb" opacity=".12"/>
  <circle cx="140" cy="700" r="250" fill="#14b8a6" opacity=".1"/>
  <text x="100" y="106" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700">From prompt to print</text>
  <text x="100" y="153" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="24">A human guided loop built with GitHub Copilot</text>

  <g filter="url(#shadow)">
    <rect x="80" y="246" width="320" height="310" rx="26" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="440" y="246" width="320" height="310" rx="26" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="800" y="246" width="320" height="310" rx="26" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="1160" y="246" width="360" height="310" rx="26" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <circle cx="126" cy="293" r="23" fill="url(#accent)"/>
    <text x="126" y="301" text-anchor="middle" fill="#082f49" font-size="21" font-weight="700">1</text>
    <text x="112" y="355" fill="#f8fafc" font-size="29" font-weight="700">Describe</text>
    <text x="112" y="402" fill="#cbd5e1" font-size="21">Text and dimensions</text>
    <text x="112" y="438" fill="#cbd5e1" font-size="21">Reference photos</text>
    <text x="112" y="474" fill="#cbd5e1" font-size="21">Selected video frames</text>

    <circle cx="486" cy="293" r="23" fill="url(#accent)"/>
    <text x="486" y="301" text-anchor="middle" fill="#082f49" font-size="21" font-weight="700">2</text>
    <text x="472" y="355" fill="#f8fafc" font-size="29" font-weight="700">Build</text>
    <text x="472" y="402" fill="#cbd5e1" font-size="21">Python for measured parts</text>
    <text x="472" y="438" fill="#cbd5e1" font-size="21">Blender for organic forms</text>
    <text x="472" y="474" fill="#cbd5e1" font-size="21">Skills and scripts repeat it</text>

    <circle cx="846" cy="293" r="23" fill="url(#accent)"/>
    <text x="846" y="301" text-anchor="middle" fill="#082f49" font-size="21" font-weight="700">3</text>
    <text x="832" y="355" fill="#f8fafc" font-size="29" font-weight="700">Inspect</text>
    <text x="832" y="402" fill="#cbd5e1" font-size="21">Validate mesh and fit</text>
    <text x="832" y="438" fill="#cbd5e1" font-size="21">Preview STL and 3MF</text>
    <text x="832" y="474" fill="#cbd5e1" font-size="21">Review and refine</text>

    <circle cx="1206" cy="293" r="23" fill="url(#accent)"/>
    <text x="1206" y="301" text-anchor="middle" fill="#082f49" font-size="21" font-weight="700">4</text>
    <text x="1192" y="355" fill="#f8fafc" font-size="29" font-weight="700">Verify the print</text>
    <text x="1192" y="402" fill="#cbd5e1" font-size="21">Slice the final project</text>
    <text x="1192" y="438" fill="#cbd5e1" font-size="21">Check plates and supports</text>
    <text x="1192" y="474" fill="#cbd5e1" font-size="21">Record results and limits</text>
  </g>
  <g stroke="url(#accent)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M400 402h30"/>
    <path d="M760 402h30"/>
    <path d="M1120 402h30"/>
  </g>
  <g fill="#34d399">
    <path d="m430 392 12 10-12 10z"/>
    <path d="m790 392 12 10-12 10z"/>
    <path d="m1150 392 12 10-12 10z"/>
  </g>
  <text x="800" y="650" text-anchor="middle" fill="#a5f3fc" font-family="Segoe UI, Arial, sans-serif" font-size="22">Copilot helps carry decisions across code, geometry, documentation, and evidence.</text>
</svg>
